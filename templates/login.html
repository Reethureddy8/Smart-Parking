<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Smart Parking</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        slate: {
                            850: '#1f2937',
                            900: '#0f172a',
                            950: '#020617',
                        },
                        primary: {
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tab-btn.active {
            color: #38bdf8;
            /* primary-400 / sky-400 */
            border-bottom-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .message.success {
            background-color: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            border: 1px solid rgba(34, 197, 94, 0.2);
            backdrop-filter: blur(4px);
        }

        .message.error {
            background-color: rgba(239, 68, 68, 0.1);
            color: #f87171;
            padding: 1rem;
            border-radius: 0.75rem;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            border: 1px solid rgba(239, 68, 68, 0.2);
            backdrop-filter: blur(4px);
        }
    </style>
</head>

<body class="h-full font-sans text-slate-100 bg-slate-900 overflow-hidden relative">

    <!-- Background Effect -->
    <div class="absolute inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-br from-slate-900 via-slate-900 to-indigo-950"></div>
        <div
            class="absolute top-0 left-0 w-full h-full bg-[url('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=2144&auto=format&fit=crop')] bg-cover bg-center opacity-20 mix-blend-overlay">
        </div>
        <!-- Animated Blobs -->
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-blue-600/20 rounded-full blur-[100px] animate-pulse"></div>
        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/20 rounded-full blur-[100px] animate-pulse"
            style="animation-delay: 2s;"></div>
    </div>

    <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 relative z-10">
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="text-center">
                <div
                    class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-gradient-to-tr from-primary-600 to-indigo-600 text-white mb-6 shadow-2xl shadow-primary-500/30 ring-1 ring-white/10">
                    <i class="fa-solid fa-square-parking text-5xl"></i>
                </div>
                <h2 class="text-4xl font-extrabold tracking-tight text-white drop-shadow-lg">
                    SmartPark <span class="text-primary-400">AI</span>
                </h2>
                <p class="mt-3 text-sm text-slate-400 font-medium">
                    Enterprise Parking Management System
                </p>
            </div>
        </div>

        <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
            <div
                class="bg-slate-800/60 backdrop-blur-xl py-10 px-6 shadow-2xl sm:rounded-3xl sm:px-12 border border-white/10 relative overflow-hidden">

                <!-- Shine effect -->
                <div
                    class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-white/20 to-transparent opacity-50">
                </div>

                <!-- Tabs -->
                <div class="flex border-b border-white/10 mb-8">
                    <button
                        class="tab-btn active w-1/2 py-4 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none transition-all duration-300 rounded-t-lg"
                        onclick="showTab('login')">
                        <i class="fa-solid fa-right-to-bracket mr-2 pointer-events-none"></i> Sign In
                    </button>
                    <button
                        class="tab-btn w-1/2 py-4 text-sm font-bold text-slate-400 border-b-2 border-transparent hover:text-white focus:outline-none transition-all duration-300 rounded-t-lg"
                        onclick="showTab('register')">
                        <i class="fa-solid fa-user-plus mr-2 pointer-events-none"></i> Register
                    </button>
                </div>

                <!-- Login Content -->
                <div id="login-tab" class="tab-content active">
                    <form id="login-form" class="space-y-6">
                        <div>
                            <label for="login-username"
                                class="block text-sm font-medium text-slate-300">Username</label>
                            <div class="mt-2 relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-user text-slate-500"></i>
                                </div>
                                <input type="text" id="login-username" name="username" required
                                    class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl leading-5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent focus:bg-slate-900 transition-all sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="login-password"
                                class="block text-sm font-medium text-slate-300">Password</label>
                            <div class="mt-2 relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-lock text-slate-500"></i>
                                </div>
                                <input type="password" id="login-password" name="password" required
                                    class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl leading-5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent focus:bg-slate-900 transition-all sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <button type="submit"
                                class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-primary-500/20 text-sm font-bold text-white bg-primary-600 hover:bg-primary-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-200 transform hover:-translate-y-0.5">
                                Sign In to Dashboard
                            </button>
                        </div>
                    </form>
                    <div id="login-message" class="message"></div>
                </div>

                <!-- Register Content -->
                <div id="register-tab" class="tab-content">
                    <form id="register-form" class="space-y-5">
                        <div>
                            <label for="register-username"
                                class="block text-sm font-medium text-slate-300">Username</label>
                            <div class="mt-1 relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-user text-slate-500"></i>
                                </div>
                                <input type="text" id="register-username" name="username" required
                                    class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl leading-5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="register-email" class="block text-sm font-medium text-slate-300">Email
                                Address</label>
                            <div class="mt-1 relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-envelope text-slate-500"></i>
                                </div>
                                <input type="email" id="register-email" name="email" required
                                    class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl leading-5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="register-password"
                                class="block text-sm font-medium text-slate-300">Password</label>
                            <div class="mt-1 relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-lock text-slate-500"></i>
                                </div>
                                <input type="password" id="register-password" name="password" required minlength="6"
                                    class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl leading-5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <label for="register-confirm" class="block text-sm font-medium text-slate-300">Confirm
                                Password</label>
                            <div class="mt-1 relative rounded-xl shadow-sm">
                                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                    <i class="fa-solid fa-shield-halved text-slate-500"></i>
                                </div>
                                <input type="password" id="register-confirm" name="confirm" required
                                    class="block w-full pl-11 pr-4 py-3 bg-slate-900/50 border border-slate-700 rounded-xl leading-5 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all sm:text-sm">
                            </div>
                        </div>

                        <div>
                            <button type="submit"
                                class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-indigo-500/20 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200 transform hover:-translate-y-0.5">
                                Create Account
                            </button>
                        </div>
                    </form>
                    <div id="register-message" class="message"></div>
                </div>

                <!-- Footer Features -->
                <div class="mt-10 pt-6 border-t border-white/10">
                    <div class="grid grid-cols-3 gap-2 text-center opacity-60">
                        <div class="flex flex-col items-center">
                            <i class="fa-solid fa-brain text-primary-400 mb-2"></i>
                            <span class="text-xs text-slate-300 font-medium">AI Core</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="fa-solid fa-shield-halved text-primary-400 mb-2"></i>
                            <span class="text-xs text-slate-300 font-medium">Secure</span>
                        </div>
                        <div class="flex flex-col items-center">
                            <i class="fa-solid fa-bolt text-primary-400 mb-2"></i>
                            <span class="text-xs text-slate-300 font-medium">Fast</span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Auth JS -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>

</html>
